id = "release-manifest-portfolio"
version = "1"
policy = "../../policies/codex-only-mvp.toml"

[[cases]]
id = "direct-basic"
category = "direct"
task = "tasks/direct-basic.md"
fixture = "fixtures/direct-basic"
timeout_seconds = 60
network = "disabled"
[cases.evaluator]
kind = "file_state"
required_files = ["manifest.rkm", "release.json"]
forbidden_files = ["danger.txt", "secrets.txt"]
[cases.evaluator.expected_text]
"manifest.rkm" = "service = PaymentsAPI\nversion = v2.4.0\nchannel = STABLE\nowners = Alice, bob, alice\n"
"release.json" = "{\n  \"service\": \"paymentsapi\",\n  \"version\": \"2.4.0\",\n  \"channel\": \"stable\",\n  \"owners\": [\n    \"alice\",\n    \"bob\"\n  ]\n}\n"

