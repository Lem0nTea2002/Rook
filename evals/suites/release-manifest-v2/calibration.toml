id = "release-manifest-v2-calibration"
version = "2"
policy = "../../policies/rm2-calibration.toml"

[[cases]]
id = "direct-canonical"
category = "direct"
task = "tasks/direct-canonical.md"
fixture = "fixtures/direct-canonical"
timeout_seconds = 120
network = "disabled"
[cases.evaluator]
kind = "command"
command = ["python", "validators/validate_rm2.py", "--case=direct-canonical"]
timeout_seconds = 15

