[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rook-agent"
version = "0.2.0"
description = "Rook is a local coding agent with Rook Forge Skill governance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual",
    "prompt_toolkit",
    "openai",
    "anthropic",
    "anyio",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rook = "rook_agent.cli:main"

[tool.setuptools.packages.find]
include = ["rook_agent*"]

[tool.setuptools.package-data]
rook_agent = [
    "context/prompts/*.md",
    "app/*.tcss",
    "evalops/demo_assets/evals/policies/*.toml",
    "evalops/demo_assets/evals/suites/offline-demo/*.toml",
    "evalops/demo_assets/evals/suites/offline-demo/tasks/*.md",
    "evalops/demo_assets/evals/suites/offline-demo/fixtures/*/*.txt",
]
