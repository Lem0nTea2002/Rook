[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rook-agent"
version = "0.2.1"
description = "Rook is a local coding agent with Rook Forge Skill governance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual",
    "prompt_toolkit",
    "openai",
    "anthropic",
    "anyio",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.16,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
rook = "rook_agent.cli:main"

[tool.setuptools.packages.find]
include = ["rook_agent*"]

[tool.setuptools.package-data]
rook_agent = [
    "context/prompts/*.md",
    "app/*.tcss",
    "evalops/demo_assets/evals/policies/*.toml",
    "evalops/demo_assets/evals/suites/offline-demo/*.toml",
    "evalops/demo_assets/evals/suites/offline-demo/tasks/*.md",
    "evalops/demo_assets/evals/suites/offline-demo/fixtures/*/*.txt",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
    "rook_agent/evalops/models.py",
    "rook_agent/evalops/policy.py",
    "rook_agent/evalops/suites.py",
    "rook_agent/evalops/service.py",
    "rook_agent/evalops/trends.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["rook_agent.evalops"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
