name: Deploy website (manual)

on:
  # The repository is private and Pages enablement can publish the site.
  # Keep deployment explicit until an owner enables Pages for GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website-demo
      - id: deployment
        uses: actions/deploy-pages@v5
