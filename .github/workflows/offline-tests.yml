name: Offline tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      ROOK_RUN_EXTERNAL_EVALS: "0"
      ROOK_ALLOW_MODEL_COSTS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Smoke test installed CLI and offline Forge demo
        run: |
          rook --help
          rook eval demo --output .rook/ci-demo

      - name: Run offline test suite
        run: python -m pytest -q --ignore=tests/test_evalplus_benchmark.py
