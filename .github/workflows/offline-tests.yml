name: Offline tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
    env:
      PYTHONUTF8: "1"
      ROOK_RUN_EXTERNAL_EVALS: "0"
      ROOK_ALLOW_MODEL_COSTS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel ".[dev]"

      - name: Smoke test installed CLI and offline Forge demo
        run: |
          rook --help
          rook eval demo --output .rook/ci-demo

      - name: Run offline test suite
        run: python -m pytest -q --ignore=tests/test_evalplus_benchmark.py

      - name: Build release artifacts
        run: python -m build

      - name: Verify a clean Windows wheel install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv-package-smoke
          $python = ".\.venv-package-smoke\Scripts\python.exe"
          $rook = ".\.venv-package-smoke\Scripts\rook.exe"
          $wheel = Get-ChildItem -LiteralPath dist -Filter "rook_agent-*.whl" | Select-Object -First 1
          & $python -m pip install $wheel.FullName
          & $python -c "import importlib.metadata as m, pathlib, tomllib; expected=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; assert m.version('rook-agent') == expected"
          & $rook --help

      - name: Verify a clean Linux wheel install
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv .venv-package-smoke
          wheel="$(find dist -maxdepth 1 -name 'rook_agent-*.whl' -print -quit)"
          .venv-package-smoke/bin/python -m pip install "$wheel"
          .venv-package-smoke/bin/python -c "import importlib.metadata as m, pathlib, tomllib; expected=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; assert m.version('rook-agent') == expected"
          .venv-package-smoke/bin/rook --help

  quality:
    name: EvalOps quality and supply chain
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      ROOK_RUN_EXTERNAL_EVALS: "0"
      ROOK_ALLOW_MODEL_COSTS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and quality dependencies
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel ".[dev]"

      - name: Lint critical Python errors
        run: ruff check rook_agent tests

      - name: Type-check critical EvalOps protocols
        run: mypy

      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off

      - name: Enforce EvalOps coverage
        run: python -m pytest -q tests/test_evalops*.py --cov=rook_agent.evalops --cov-report=term-missing:skip-covered

  docker-execution:
    name: Linux Docker execution boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      ROOK_RUN_EXTERNAL_EVALS: "0"
      ROOK_ALLOW_MODEL_COSTS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel ".[dev]"

      - name: Pull and resolve the Linux test image digest
        id: image
        shell: bash
        run: |
          docker pull python:3.12.11-slim-bookworm
          image="$(docker image inspect python:3.12.11-slim-bookworm --format '{{index .RepoDigests 0}}')"
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Verify the networkless Docker executor
        env:
          ROOK_RUN_DOCKER_TESTS: "1"
          ROOK_TEST_DOCKER_IMAGE: ${{ steps.image.outputs.image }}
        run: python -m pytest -q tests/test_execution_docker_integration.py
